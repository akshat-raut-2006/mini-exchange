server:
  port: 8080

spring:
  datasource:
    url: "jdbc:sqlite:data/exchange.db?busy_timeout=30000"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.matchingengine: INFO